[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-rl"
version = "0.1.0"
description = "Template environment for MuJoCo reinforcement learning"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "mujoco>=3.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
train = [
  "stable-baselines3>=2.2",
  "torch>=2.2",
  "tensorboard>=2.16",
]

[tool.setuptools.package-data]
"mujoco_rl.envs" = ["assets/*.xml"]


[tool.setuptools.packages.find]
include = ["mujoco_rl*"]
